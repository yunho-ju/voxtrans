[package]
name = "voxtrans-client"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
libc = "0.2"
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
url = "2"
bytemuck = { version = "1", features = ["derive"] }
# commands.rs:25 timestamps the meeting notes file. Never declared, so the
# crate has not compiled from this repository state — chrono was only in
# Cargo.lock, pulled in transitively by serde_with.
chrono = "0.4"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# The client had no tests before feature 002. Integration tests live in
# tests/ and exercise the library crate, not the Tauri app shell.
tempfile = "3"

[lib]
name = "voxtrans_client_lib"
crate-type = ["lib", "cdylib", "staticlib"]
